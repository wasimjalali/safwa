<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ṣafwa - teacher view</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("../fonts/Vazirmatn-Variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        --studio: #121916;
        --panel: #1a221e;
        --line: rgba(244, 239, 227, 0.08);
        --ink: #ece7d9;
        --muted: #8b948d;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--studio);
        color: var(--ink);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .stage {
        display: grid;
        grid-template-columns: 1fr 380px;
        height: 100%;
      }

      .stage-void { background: #0c1210; }

      .feed {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--panel);
        border-inline-start: 1px solid var(--line);
      }

      .feed-head {
        flex: 0 0 44px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }

      #panel {
        flex: 1;
        overflow-y: auto;
      }

      .sy-comment {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 14px;
      }
      .sy-comment + .sy-comment { border-top: 1px solid var(--line); }
      .sy-avatar {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(244, 239, 227, 0.1);
        color: var(--ink);
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sy-body { min-width: 0; direction: rtl; text-align: right; flex: 1; }
      .sy-author {
        font-family: "Vazirmatn", Tahoma, sans-serif;
        font-weight: 700;
        font-size: 13px;
        margin-inline-end: 6px;
      }
      .sy-platform { color: var(--muted); font-size: 11px; text-transform: capitalize; }
      .sy-text {
        margin-top: 2px;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        font-size: 16px;
        line-height: 1.85;
      }

      /* The real popup, as a Chrome window over the studio. */
      .chrome-popup {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 50;
        width: 280px;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      }
      .chrome-popup .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 56px;
        padding: 0 12px 0 10px;
        background: #0a3d32;
        color: #f7f3ea;
        font-family: "Vazirmatn", Tahoma, sans-serif;
      }
      .chrome-popup .brand__logo {
        width: 28px;
        height: 28px;
        border-radius: 7px;
      }
      .chrome-popup .brand__fa {
        flex: 1;
        min-width: 0;
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1;
      }
      .chrome-popup .switch {
        position: relative;
        flex: 0 0 auto;
        width: 48px;
        height: 28px;
        padding: 0;
        border: 1px solid rgba(247, 243, 234, 0.2);
        border-radius: 999px;
        background: #8a8474;
        cursor: pointer;
      }
      .chrome-popup .switch[aria-checked="true"] {
        background: #2f9a72;
        border-color: #2f9a72;
      }
      .chrome-popup .switch__knob {
        position: absolute;
        top: 2px;
        inset-inline-start: 2px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(20, 34, 28, 0.28);
        transition: inset-inline-start 150ms var(--ease-out);
      }
      .chrome-popup .switch[aria-checked="true"] .switch__knob {
        inset-inline-start: calc(100% - 24px);
      }
      .chrome-popup .switch:focus-visible {
        outline: 2px solid #f7f3ea;
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .chrome-popup .switch__knob { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-void"></div>
      <section class="feed">
        <div class="feed-head">Comments</div>
        <div id="panel"></div>
      </section>
    </div>

    <div class="chrome-popup" dir="rtl">
      <header class="brand">
        <img class="brand__logo" src="../icons/icon48.png" alt="" />
        <h1 class="brand__fa">صفوة</h1>
        <button id="toggle" class="switch" role="switch" aria-checked="true" aria-label="فعال">
          <span class="switch__knob"></span>
        </button>
      </header>
    </div>

    <script type="module" src="./teacher.js"></script>
  </body>
</html>
