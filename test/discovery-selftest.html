<!DOCTYPE html>
<!-- Discovery self-test: a fake StreamYard comment feed whose class names are
     deliberately DIFFERENT from the shipped SELECTORS, simulating a future
     StreamYard redesign. Loading dom-discovery-console.js on this page must
     recover container / row / text / author from live DOM shape alone. -->
<html lang="en">
<head><meta charset="utf-8"><title>Mock StreamYard (renamed classes)</title></head>
<body>
  <div class="studio-root">
    <div class="right-dock">
      <div class="tabstrip"><span>Comments</span><span>Starred</span></div>
      <div class="feed-shell">
        <div class="post-card">
          <div class="usr-tag">کریم</div>
          <div class="msg-body">سلام استاد، آیا نماز در سفر قصر خوانده می‌شود؟</div>
          <img class="net-badge" alt="youtube" src="x.png">
        </div>
        <div class="post-card">
          <div class="usr-tag">زینب</div>
          <div class="msg-body">حکم نکاح مؤقت در سفر چیست؟</div>
          <img class="net-badge" alt="facebook" src="x.png">
        </div>
        <div class="post-card">
          <div class="usr-tag">مولوی صاحب</div>
          <div class="msg-body">نماز تراویح چند رکعت است؟</div>
          <img class="net-badge" alt="youtube" src="x.png">
        </div>
        <div class="post-card">
          <div class="usr-tag">احمد</div>
          <div class="msg-body">آیا زکات بر طلا واجب است که فقرا بگیرند؟</div>
          <img class="net-badge" alt="youtube" src="x.png">
        </div>
      </div>
    </div>
  </div>

</html>
