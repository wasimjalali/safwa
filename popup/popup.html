<!DOCTYPE html>
<!--
  popup.html - the bar that opens when the Ṣafwa icon is clicked. One job:
  turn the filter on or off. The state is persisted in chrome.storage.local;
  the content script listens and applies it to the live feed instantly.
  All visible strings come from CONFIG.LABELS (popup.js fills them in).
-->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>صفوة</title>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="../icons/icon32.png?v=2" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <img class="brand__logo" src="../icons/icon48.png" alt="" />
      <h1 class="brand__fa">صفوة</h1>
      <button id="toggle" class="switch" role="switch" aria-checked="true">
        <span class="switch__knob"></span>
      </button>
    </header>
    <script type="module" src="popup.js"></script>
  </body>
</html>
