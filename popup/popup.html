<!DOCTYPE html>
<!--
  popup.html - the bar that opens when the Ṣafwa icon is clicked.
  Two rooms: live (on/off + reset) and settings (the five teacher toggles).
-->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="../icons/icon32.png" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <img class="brand__logo" src="../icons/icon48.png" alt="" />
      <div class="brand__names">
        <h1 class="brand__fa">صفوة</h1>
        <p id="tagline" class="brand__tagline"></p>
      </div>
    </header>

    <div class="seg" role="tablist">
      <button
        type="button"
        id="tab-live"
        class="seg__tab"
        role="tab"
        aria-selected="true"
        aria-controls="room-live"
      ></button>
      <button
        type="button"
        id="tab-settings"
        class="seg__tab"
        role="tab"
        aria-selected="false"
        aria-controls="room-settings"
      ></button>
    </div>

    <section id="room-live" class="room" role="tabpanel" aria-labelledby="tab-live">
      <div class="master-row">
        <p id="master-word" class="master-row__v"></p>
        <button id="toggle" class="switch" role="switch" aria-checked="true">
          <span class="switch__knob"></span>
        </button>
      </div>
      <p id="hint" class="hint"></p>

      <div class="reset-row">
        <button type="button" id="reset" class="reset"></button>
        <button
          type="button"
          class="help"
          data-help="reset"
          aria-expanded="false"
          aria-controls="explain-reset"
        ></button>
      </div>
      <div id="explain-reset" class="explain" hidden></div>
      <p id="reset-status" class="reset-status" hidden></p>
    </section>

    <section
      id="room-settings"
      class="room"
      role="tabpanel"
      aria-labelledby="tab-settings"
      hidden
    >
      <div id="settings-list"></div>
    </section>

    <footer class="footer">
      <span id="footer-label"></span>
      <span id="version" class="footer__version"></span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
