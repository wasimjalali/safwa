<!DOCTYPE html>
<!--
  popup.html - the bar that opens when the Ṣafwa icon is clicked.
  Master on/off, then teacher settings with Dari help on each row.
-->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="../icons/icon32.png" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <img class="brand__logo" src="../icons/icon48.png" alt="" />
      <div class="brand__names">
        <h1 class="brand__fa">صفوة</h1>
        <p id="tagline" class="brand__tagline"></p>
      </div>
      <button id="toggle" class="switch" role="switch" aria-checked="true">
        <span class="switch__knob"></span>
      </button>
    </header>
    <p id="hint" class="hint"></p>

    <section class="settings" aria-labelledby="settings-heading">
      <h2 id="settings-heading" class="settings__heading"></h2>
      <div id="settings-list"></div>

      <div class="reset-row">
        <button type="button" id="reset" class="reset"></button>
        <button
          type="button"
          class="help"
          data-help="reset"
          aria-expanded="false"
          aria-controls="explain-reset"
        ></button>
      </div>
      <div id="explain-reset" class="explain" hidden></div>
      <p id="reset-status" class="reset-status" hidden></p>
    </section>

    <footer class="footer">
      <span id="footer-label"></span>
      <span id="version" class="footer__version"></span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
